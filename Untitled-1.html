<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Keyboard Controlled Object</title>
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			background: #172033 url("1920x1080.jpg") center / cover no-repeat;
			font-family: Arial, sans-serif;
		}

		canvas {
			max-width: 90vw;
			height: auto;
			border: 3px solid #f4f1de;
			background: #263653 url("1920x1080.jpg") center / cover no-repeat;
		}
	</style>
</head>
<body>
	<canvas id="canvas" width="800" height="600"></canvas>

	<script>
		const canvas = document.getElementById("canvas");
		const context = canvas.getContext("2d");
		const keys = new Set();
		const backgroundImage = new Image();
		backgroundImage.src = "1920x1080.jpg";
		const objectImage = new Image();
		objectImage.src = "219-2191732_15-flat-vector-spaceship-sprites-spaceship-sprites-png.png";
		const smallSquareImage = new Image();
		smallSquareImage.src = "images.jpg";
		const object = {
			x: canvas.width / 2 - 25,
			y: canvas.height / 2 - 25,
			size: 50,
			speed: 4
		};
		const smallSquares = [];
		const spawnInterval = 500;
		let lastSpawnTime = 0;

		window.addEventListener("keydown", (event) => {
			if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "w", "a", "s", "d"].includes(event.key)) {
				event.preventDefault();
				keys.add(event.key.toLowerCase());
			}
		});

		window.addEventListener("keyup", (event) => {
			keys.delete(event.key.toLowerCase());
		});

		function spawnSmallSquare() {
			const size = 12;
			const angle = Math.random() * Math.PI * 2;

			smallSquares.push({
				x: object.x + object.size / 2 - size / 2,
				y: object.y + object.size / 2 - size / 2,
				size,
				velocityX: Math.cos(angle) * 2.5,
				velocityY: Math.sin(angle) * 2.5
			});
		}

		function update(currentTime) {
			if (keys.has("arrowup") || keys.has("w")) object.y -= object.speed;
			if (keys.has("arrowdown") || keys.has("s")) object.y += object.speed;
			if (keys.has("arrowleft") || keys.has("a")) object.x -= object.speed;
			if (keys.has("arrowright") || keys.has("d")) object.x += object.speed;

			object.x = Math.max(0, Math.min(canvas.width - object.size, object.x));
			object.y = Math.max(0, Math.min(canvas.height - object.size, object.y));

			if (currentTime - lastSpawnTime >= spawnInterval) {
				spawnSmallSquare();
				lastSpawnTime = currentTime;
			}

			for (const smallSquare of smallSquares) {
				smallSquare.x += smallSquare.velocityX;
				smallSquare.y += smallSquare.velocityY;
			}

			for (let index = smallSquares.length - 1; index >= 0; index--) {
				const smallSquare = smallSquares[index];
				if (
					smallSquare.x + smallSquare.size < 0 ||
					smallSquare.x > canvas.width ||
					smallSquare.y + smallSquare.size < 0 ||
					smallSquare.y > canvas.height
				) {
					smallSquares.splice(index, 1);
				}
			}
		}

		function draw() {
			context.clearRect(0, 0, canvas.width, canvas.height);
			if (backgroundImage.complete && backgroundImage.naturalWidth > 0) {
				context.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
			}
			context.fillStyle = "#f4f1de";
			context.font = "18px Arial";
			context.fillText("Use arrow keys or WASD to move", 20, 32);
			for (const smallSquare of smallSquares) {
				if (smallSquareImage.complete && smallSquareImage.naturalWidth > 0) {
					context.drawImage(smallSquareImage, smallSquare.x, smallSquare.y, smallSquare.size, smallSquare.size);
				}
			}
			if (objectImage.complete && objectImage.naturalWidth > 0) {
				context.drawImage(objectImage, object.x, object.y, object.size, object.size);
			}
		}

		function gameLoop(currentTime) {
			update(currentTime);
			draw();
			requestAnimationFrame(gameLoop);
		}

		gameLoop();
	</script>
</body>
</html>
